<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Web App Example</title>
    <!-- CSS Styling -->
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>C++ Web Calculator</h2>
        <input type="number" id="num1" placeholder="Pahla number likhein">
        <input type="number" id="num2" placeholder="Dusra number likhein">
        <button onclick="calculate()">Calculate (C++ Backend)</button>
        
        <div id="result"></div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        async function calculate() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const resultDiv = document.getElementById('result');

            if (num1 === '' || num2 === '') {
                resultDiv.innerText = "Kripya dono numbers bharein!";
                resultDiv.style.color = "red";
                return;
            }

            resultDiv.style.color = "#333";
            resultDiv.innerText = "Calculating...";

            try {
                // Fetch Request to C++ Backend (CGI Script)
                const response = await fetch(`/cgi-bin/server.cgi?num1=${num1}&num2=${num2}`);
                const data = await response.json();
                
                resultDiv.style.color = "#28a745";
                resultDiv.innerText = "Result (C++ Output): " + data.result;
            } catch (error) {
                resultDiv.style.color = "red";
                resultDiv.innerText = "Server Error!";
                console.error("Error:", error);
            }
        }
    </script>
</body>
</html>
